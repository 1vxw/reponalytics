name: Generate Stats Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Generate images
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          GITHUB_USERNAME: ${{ secrets.USERNAME }}
        run: |
          python3 --version
          python3 main.py
          test -d generated || (echo "generated/ folder was not created" && exit 1)
          test -f generated/traffic_chart.svg || (echo "generated/traffic_chart.svg was not created" && exit 1)

      - name: Commit and push generated SVG
        run: |
          git config --global user.name "github-stats[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp_dir="$(mktemp -d)"
          cp -R generated "$tmp_dir/generated"

          git checkout output 2>/dev/null || git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          mkdir -p generated
          cp -R "$tmp_dir/generated/." generated/

          git add generated
          git commit -m 'Update generated files' || echo
          git push origin output -f
